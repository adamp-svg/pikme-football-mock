# Deploy the game to Render on every push to main.
#
# WHY THIS EXISTS: Render reports autoDeploy=yes for the pikme-football service, but the
# GitHub -> Render link is broken — there is no repo webhook on adamp-svg/pikme-football-mock and
# no Render GitHub App installation covering it, so pushes were silently NOT deploying. The game
# server sat 61 commits behind production for two days because everyone assumed "push = deploy".
# Re-arming autoDeploy through the Render API was tried and provably did nothing (an empty probe
# commit, 564cdc4, produced no deploy in 3 minutes).
#
# So this workflow becomes the event path: GitHub Actions calls the Render API directly. It does not
# depend on the webhook, the GitHub App, or anyone's laptop.
#
# SETUP (one time): create a Render API key at
#   Render dashboard -> account menu -> Account Settings -> API Keys -> Create API Key
# then store it:  gh secret set RENDER_API_KEY --repo adamp-svg/pikme-football-mock
#
# If the GitHub App link is ever repaired, DELETE this workflow — otherwise every push deploys
# twice (Render's own trigger plus this one), which just wastes build minutes.
name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you re-deploy the current main without an empty commit

# Never run two deploys of the same service at once, and don't cancel one midway: Render would
# be left with a half-finished deploy. Queue instead.
concurrency:
  group: render-deploy-pikme-football
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Trigger the Render deploy
        id: trigger
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: srv-d9ebcvtaeets73ar91sg     # pikme-football (web, standard plan)
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::error::RENDER_API_KEY secret is not set — see the setup note at the top of this file."
            exit 1
          fi
          # clearCache=do_not_clear keeps builds fast; the build command is a plain npm install.
          resp=$(curl -sS -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'content-type: application/json' \
            -d '{"clearCache":"do_not_clear"}' \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys")
          id=$(printf '%s' "$resp" | jq -r '.id // empty')
          if [ -z "$id" ]; then
            echo "::error::Render did not return a deploy id. Response: $resp"
            exit 1
          fi
          echo "deploy_id=$id" >> "$GITHUB_OUTPUT"
          echo "Triggered $id for commit $(printf '%s' "$resp" | jq -r '.commit.id // "?"' | cut -c1-9)"

      - name: Wait for it to go live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: srv-d9ebcvtaeets73ar91sg
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          set -euo pipefail
          # A green workflow must mean "the new code is actually serving traffic". Polling the
          # deploy's own status is the only way to know — the trigger call returns immediately.
          for i in $(seq 1 60); do
            status=$(curl -sS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID" | jq -r '.status')
            echo "[$i] $status"
            case "$status" in
              live)
                echo "::notice::Deploy $DEPLOY_ID is live."
                exit 0 ;;
              build_failed|update_failed|canceled|pre_deploy_failed|deactivated)
                echo "::error::Deploy $DEPLOY_ID ended as '$status'. See the Render dashboard logs."
                exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Timed out after ~15min waiting for deploy $DEPLOY_ID."
          exit 1
