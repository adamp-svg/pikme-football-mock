<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saltiz on iPhone — device harness</title>
<style>
  /* ============================================================================
     DEV-ONLY device harness. Runs the real localhost game inside an accurate
     iPhone chassis at the phone's TRUE logical resolution (CSS pt), so media
     queries and innerWidth/innerHeight in the game match the real device.

     The frame is sized in points and then CSS-scaled as one unit — never resize
     the iframe to "fit", or the game would see the wrong viewport.

     Landscape note: the Dynamic Island / notch lives on a SHORT edge (left or
     right, vertically centred) when the phone is rotated — NOT top-centre. The
     home indicator stays on the bottom long edge. That's what this reproduces.
     ============================================================================ */
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 120% at 50% 0%,#1b2026,#08090b 70%);
    color:#c9d3cd;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;overflow:hidden;
  }

  /* ---- control bar ---- */
  .bar{position:fixed;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;
    justify-content:center;padding:10px 14px;background:rgba(10,13,15,.82);backdrop-filter:blur(8px);
    border-bottom:1px solid #1e262a;z-index:50}
  .bar label{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#8fa096;white-space:nowrap}
  .bar select,.bar button{
    background:#18211d;color:#e8f0e9;border:1px solid #2b3833;border-radius:8px;
    padding:6px 10px;font:600 12px system-ui,sans-serif;cursor:pointer}
  .bar button[aria-pressed="true"]{background:#2b6b3f;border-color:#3f8f57;color:#eaffef}
  .bar input[type=range]{width:104px;accent-color:#4ea0ff}
  .spec{font:600 12px ui-monospace,SFMono-Regular,Consolas,monospace;color:#6f8078;
    padding:5px 9px;border:1px solid #212b26;border-radius:8px;background:#0e1512}
  .spec b{color:#ffcb43;font-weight:700}

  /* ---- device chassis ---- */
  .stage{display:grid;place-items:center;flex:1;width:100%;padding-top:44px}
  .device{position:relative;transform-origin:center center;
    /* titanium rail + glass back */
    background:linear-gradient(145deg,#8e939b 0%,#3d4248 18%,#23262a 50%,#3a3f45 82%,#8b9098 100%);
    box-shadow:0 46px 90px rgba(0,0,0,.75), 0 4px 12px rgba(0,0,0,.6),
               inset 0 0 0 1.5px rgba(255,255,255,.28), inset 0 0 0 4px #101315;}
  .screen{position:relative;overflow:hidden;background:#000;box-shadow:inset 0 0 0 2px #000}
  iframe{border:0;display:block;background:#0c120e}

  /* Dynamic Island / notch — .cut is positioned per orientation by JS */
  .cut{position:absolute;background:#000;z-index:9;pointer-events:none;box-shadow:inset 0 0 0 1px #101010}
  /* front camera lens inside the island */
  .cut::after{content:"";position:absolute;border-radius:50%;
    background:radial-gradient(circle at 34% 32%,#20364a,#050a10 70%);
    box-shadow:inset 0 0 0 1.5px #02060a, 0 0 3px rgba(90,160,220,.35)}
  .home-ind{position:absolute;background:#fff;opacity:.92;border-radius:99px;z-index:9;pointer-events:none}

  /* physical buttons on the rails */
  .btn{position:absolute;background:linear-gradient(180deg,#9aa0a8,#4a4f55);border-radius:2px;z-index:2}

  /* safe-area guides (overlay only — a plain iframe can't receive real env() insets) */
  .safe{position:absolute;inset:0;z-index:8;pointer-events:none;display:none}
  .safe.on{display:block}
  .safe i{position:absolute;background:rgba(255,90,80,.16);box-shadow:inset 0 0 0 1px rgba(255,90,80,.55)}
  .safe em{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font:600 10px ui-monospace,monospace;
    color:#ffb3ab;background:rgba(0,0,0,.6);padding:2px 7px;border-radius:6px;font-style:normal}

  .cap{position:fixed;bottom:8px;left:0;right:0;text-align:center;color:#55655d;font-size:11.5px}
  .cap b{color:#8fa096}
</style></head><body>

<div class="bar">
  <label>מכשיר
    <select id="dev"></select>
  </label>
  <button id="orient" aria-pressed="true">↔ Landscape</button>
  <button id="side" aria-pressed="false">Island ◧ Left</button>
  <button id="safeBtn" aria-pressed="false">Safe area</button>
  <label>Zoom <input id="zoom" type="range" min="40" max="150" step="5" value="100"></label>
  <button id="reload">⟳ Reload</button>
  <span class="spec" id="spec">—</span>
</div>

<div class="stage">
  <div class="device" id="device">
    <div class="screen" id="screen">
      <iframe id="game" title="Saltiz game"></iframe>
      <div class="safe" id="safe"><em id="safeLbl"></em></div>
      <div class="cut" id="cut"></div>
      <div class="home-ind" id="home"></div>
    </div>
  </div>
</div>

<div class="cap">Dev harness — the real localhost game at true logical resolution. <b>Not shipped to players.</b></div>

<script>
/* Logical POINT sizes (portrait W×H) — what the browser reports as innerWidth/innerHeight
   on the real device. `cut` = 'island' | 'notch' | 'none'. `r` = screen corner radius (pt).
   `safe` = approximate iOS safe-area insets. */
const DEVICES = [
  { id:'17pro',  name:'iPhone 17 Pro / 16 Pro',        w:402, h:874, cut:'island', r:55, bezel:11 },
  { id:'17',     name:'iPhone 17 / 16 / 15',           w:393, h:852, cut:'island', r:55, bezel:11 },
  { id:'17pm',   name:'iPhone 17 Pro Max / 16 Pro Max',w:440, h:956, cut:'island', r:55, bezel:11 },
  { id:'16plus', name:'iPhone 16 Plus / 15 Pro Max',   w:430, h:932, cut:'island', r:55, bezel:11 },
  { id:'14',     name:'iPhone 14 / 13',                w:390, h:844, cut:'notch',  r:47, bezel:11 },
  { id:'13mini', name:'iPhone 13 mini',                w:375, h:812, cut:'notch',  r:44, bezel:10 },
  { id:'se',     name:'iPhone SE (3rd gen)',           w:375, h:667, cut:'none',   r:0,  bezel:10 },
];
// Dynamic Island / notch dimensions in PORTRAIT orientation (pt).
const CUT = {
  island: { w:125, h:37, gap:11 },   // floats below the top edge
  notch:  { w:162, h:33, gap:0  },   // hangs off the top edge
};
// Approximate iOS safe-area insets (pt). Landscape is symmetric on notched phones.
function insetsFor(d, landscape) {
  if (d.cut === 'none') return landscape ? {t:0,b:0,l:0,r:0} : {t:20,b:0,l:0,r:0};
  const side = d.cut === 'island' ? 59 : 47;
  return landscape ? {t:0,b:21,l:side,r:side} : {t:d.cut==='island'?59:47,b:34,l:0,r:0};
}

const $ = (id) => document.getElementById(id);
const S = {                                  // persisted harness prefs
  dev:  localStorage.getItem('ph.dev')  || '17pro',
  land: localStorage.getItem('ph.land') !== '0',
  left: localStorage.getItem('ph.left') !== '0',
  safe: localStorage.getItem('ph.safe') === '1',
  zoom: +(localStorage.getItem('ph.zoom') || 100),
};
const save = () => {
  localStorage.setItem('ph.dev', S.dev); localStorage.setItem('ph.land', S.land ? '1':'0');
  localStorage.setItem('ph.left', S.left ? '1':'0'); localStorage.setItem('ph.safe', S.safe ? '1':'0');
  localStorage.setItem('ph.zoom', String(S.zoom));
};

// device picker
DEVICES.forEach((d) => { const o = document.createElement('option'); o.value = d.id; o.textContent = d.name; $('dev').appendChild(o); });
$('dev').value = S.dev;

function render() {
  const d = DEVICES.find((x) => x.id === S.dev) || DEVICES[0];
  const land = S.land;
  const W = land ? d.h : d.w, H = land ? d.w : d.h;   // screen size in points
  const bz = d.bezel, R = d.r;

  // --- chassis + screen at true logical size ---
  const dev = $('device'), scr = $('screen'), fr = $('game'), cut = $('cut'), home = $('home');
  dev.style.width = (W + bz*2) + 'px';
  dev.style.height = (H + bz*2) + 'px';
  dev.style.padding = bz + 'px';
  dev.style.borderRadius = (R ? R + bz : 14) + 'px';
  scr.style.width = W + 'px'; scr.style.height = H + 'px';
  scr.style.borderRadius = R + 'px';
  fr.style.width = W + 'px'; fr.style.height = H + 'px';

  // --- Dynamic Island / notch: TOP-CENTRE in portrait, SIDE-CENTRE in landscape ---
  cut.style.display = d.cut === 'none' ? 'none' : 'block';
  if (d.cut !== 'none') {
    const c = CUT[d.cut];
    cut.style.cssText = ''; // reset the per-orientation box before re-applying
    if (!land) {                                   // PORTRAIT — pill across the top, camera on its right
      Object.assign(cut.style, {
        width: c.w + 'px', height: c.h + 'px', left: '50%', top: c.gap + 'px',
        transform: 'translateX(-50%)', right: 'auto', bottom: 'auto',
        borderRadius: d.cut === 'island' ? '99px' : `0 0 ${c.h/2}px ${c.h/2}px`,
      });
      cut.style.setProperty('--lx', 'auto');
    } else {                                       // LANDSCAPE — pill runs VERTICALLY down one short edge
      const onLeft = S.left;
      Object.assign(cut.style, {
        width: c.h + 'px', height: c.w + 'px', top: '50%', transform: 'translateY(-50%)',
        left: onLeft ? c.gap + 'px' : 'auto', right: onLeft ? 'auto' : c.gap + 'px', bottom: 'auto',
        borderRadius: d.cut === 'island' ? '99px' : (onLeft ? `0 ${c.h/2}px ${c.h/2}px 0` : `${c.h/2}px 0 0 ${c.h/2}px`),
      });
    }
    // camera lens: sits at the far end of the pill (top edge in landscape, right end in portrait)
    const lens = 11;
    cut.style.setProperty('--ls', lens + 'px');
    const st = document.getElementById('lensStyle') || Object.assign(document.createElement('style'), { id: 'lensStyle' });
    st.textContent = land
      ? `.cut::after{width:${lens}px;height:${lens}px;left:50%;transform:translateX(-50%);top:9px;bottom:auto;right:auto}`
      : `.cut::after{width:${lens}px;height:${lens}px;right:11px;top:50%;transform:translateY(-50%);left:auto;bottom:auto}`;
    document.head.appendChild(st);
  }

  // --- home indicator: always the BOTTOM long edge (SE has a home button instead) ---
  if (d.cut === 'none') { home.style.display = 'none'; }
  else {
    home.style.display = 'block';
    const wI = Math.round(W * 0.36);
    Object.assign(home.style, { width: wI + 'px', height: '5px', left: '50%', bottom: '7px',
      top: 'auto', transform: 'translateX(-50%)' });
  }

  // --- safe-area guides ---
  const ins = insetsFor(d, land);
  const safe = $('safe');
  safe.classList.toggle('on', S.safe);
  safe.querySelectorAll('i').forEach((n) => n.remove());
  const band = (css) => { const i = document.createElement('i'); Object.assign(i.style, css); safe.appendChild(i); };
  if (ins.l) band({ left:0, top:0, bottom:0, width: ins.l + 'px' });
  if (ins.r) band({ right:0, top:0, bottom:0, width: ins.r + 'px' });
  if (ins.t) band({ left:0, right:0, top:0, height: ins.t + 'px' });
  if (ins.b) band({ left:0, right:0, bottom:0, height: ins.b + 'px' });
  $('safeLbl').textContent = `safe-area  T${ins.t} R${ins.r} B${ins.b} L${ins.l}`;

  // --- physical buttons on the rails (cosmetic) ---
  dev.querySelectorAll('.btn').forEach((n) => n.remove());
  if (d.cut !== 'none') {
    const mk = (css) => { const b = document.createElement('div'); b.className = 'btn'; Object.assign(b.style, css); dev.appendChild(b); };
    const t = bz + 2;
    if (!land) { // portrait: action+volume left rail, power right rail
      mk({ left:'-2px', top: (H*0.16) + 'px', width:'3px', height:'26px' });
      mk({ left:'-2px', top: (H*0.24) + 'px', width:'3px', height:'46px' });
      mk({ left:'-2px', top: (H*0.33) + 'px', width:'3px', height:'46px' });
      mk({ right:'-2px', top: (H*0.26) + 'px', width:'3px', height:'72px' });
    } else {    // landscape: same rails, rotated with the device
      mk({ top:'-2px', left: (W*0.16) + 'px', height:'3px', width:'26px' });
      mk({ top:'-2px', left: (W*0.24) + 'px', height:'3px', width:'46px' });
      mk({ top:'-2px', left: (W*0.33) + 'px', height:'3px', width:'46px' });
      mk({ bottom:'-2px', left: (W*0.26) + 'px', height:'3px', width:'72px' });
    }
  }

  // --- labels + fit ---
  $('spec').innerHTML = `<b>${W}×${H}</b> pt · ${d.cut === 'none' ? 'no notch' : d.cut} · @3x = ${W*3}×${H*3}px`;
  $('orient').textContent = land ? '↔ Landscape' : '↕ Portrait';
  $('orient').setAttribute('aria-pressed', String(land));
  $('side').textContent = S.left ? 'Island ◧ Left' : 'Island ◨ Right';
  $('side').setAttribute('aria-pressed', String(!S.left));
  $('side').style.display = (land && d.cut !== 'none') ? '' : 'none';
  $('safeBtn').setAttribute('aria-pressed', String(S.safe));
  fit();
}

// Scale the whole chassis as ONE unit (the iframe keeps its true point size).
function fit() {
  const d = $('device');
  const w = d.offsetWidth, h = d.offsetHeight;
  const room = Math.min((innerWidth - 40) / w, (innerHeight - 110) / h);
  d.style.transform = 'scale(' + Math.min(S.zoom / 100, room) + ')';
}

function loadGame() {
  // forward ?edit=1 (layout editor) + a name into the game, like the old harness did
  const edit = /[?&]edit=1/.test(location.search);
  $('game').src = '/?name=Player' + (edit ? '&edit=1' : '') + '&t=' + Date.now();
}

$('dev').addEventListener('change', (e) => { S.dev = e.target.value; save(); render(); });
$('orient').addEventListener('click', () => { S.land = !S.land; save(); render(); });
$('side').addEventListener('click', () => { S.left = !S.left; save(); render(); });
$('safeBtn').addEventListener('click', () => { S.safe = !S.safe; save(); render(); });
$('zoom').addEventListener('input', (e) => { S.zoom = +e.target.value; save(); fit(); });
$('reload').addEventListener('click', loadGame);
addEventListener('resize', fit);

$('zoom').value = S.zoom;
loadGame();
render();
</script>
</body></html>
