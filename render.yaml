# Render Blueprint — one-click deploy of the football game server.
# Render provides PORT + TLS automatically; the app connects over wss://.
services:
  - type: web
    name: pikme-football
    env: node
    plan: free
    # --omit=dev: jsdom is a devDependency (test-modes-table.mjs renders index.html
    # headlessly). The server never needs it, so keep it out of the deploy.
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /
